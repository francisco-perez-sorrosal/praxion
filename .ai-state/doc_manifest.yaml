- id: ai-state-decisions-194-verifier-tier-appropriateness
  path: .ai-state/decisions/194-verifier-tier-appropriateness.md
  type: markdown
  title: Verifier validates scoped-test tier-appropriateness as a document cross-check, not a re-run
  last_modified: '2026-05-19'
  renderer: adr_card
  summary: "The verifier checks that each topology-scoped step's declared Tests tier was consistent with the breadth of subsystems the step touched, by cross-referencing the step's file footprint against\
    \ TEST_TOPOLOGY.md \u2014 a document/diff check, not a test re-execution. Mismatches produce a WARN."
