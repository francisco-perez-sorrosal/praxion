- id: ai-state-decisions-084-integration-checkpoint-scope
  path: .ai-state/decisions/084-integration-checkpoint-scope.md
  type: markdown
  title: Integration checkpoint runs the full pipeline-tier suite
  last_modified: '2026-05-08'
  renderer: adr_card
  summary: The final integration-checkpoint step in a Standard/Full-tier pipeline runs the full pipeline-tier suite (every pocket, every group), not the more aggressive "touched-pockets-pipeline-tier" optimization.
