  path: .ai-state/decisions/243-reliability-skills-not-agent.md
  type: markdown
  title: Agentic-app-reliability frontier practices land as skills, not a 17th agent
  last_modified: '2026-06-20'
  renderer: adr_card
  summary: "Blend the five agentic-app-reliability frontier candidates into Praxion as two new skills plus deepened references in two existing skills and zero new rules, consumed by existing agents \u2014\
    \ no new shadow sub-architect agent."
  frontmatter:
    id: dec-243
    title: Agentic-app-reliability frontier practices land as skills, not a 17th agent
    status: accepted
    category: architectural
    date: 2026-06-20
    summary: "Blend the five agentic-app-reliability frontier candidates into Praxion as two new skills plus deepened references in two existing skills and zero new rules, consumed by existing agents \u2014\
      \ no new shadow sub-architect agent."
    tags:
    - agents
    - skills
    - agentic-reliability
    - evals
    - observability
    - guardrails
    - budget
    - pipeline
    made_by: agent
    agent_type: systems-architect
