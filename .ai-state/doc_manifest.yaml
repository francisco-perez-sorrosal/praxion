  last_modified: '2026-05-12'
  renderer: adr_card
  summary: "The DEFAULT PARTITION \u2014 systems-architect decides THAT an interface surface exists and its role in the system; interface-designer decides WHAT it looks like \u2014 the resource/endpoint/tool\
    \ model, error contract, pagination strategy, UI framework, component patterns, design tokens, interaction model. The two coexist as concurrent shadows. agents/systems-architect.md gets additive bullets;\
    \ no change to onboarding modes. On top of this partition, dec-154 adds the active dynamic \u2014 the interface-designer is a quality advocate with standing to challenge architectural decisions that\
    \ constrain a materially-better design, via an orchestrator-mediated loop."
