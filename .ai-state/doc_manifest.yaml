- id: ai-state-decisions-247-monorepo-healthcheck-detection
  path: .ai-state/decisions/247-monorepo-healthcheck-detection.md
  type: markdown
  title: Make readiness healthcheck detection monorepo-aware (subdir-service + route-handler signals)
  last_modified: '2026-06-20'
  renderer: adr_card
  summary: Extend _detect_healthcheck beyond the root Dockerfile/package.json to a bounded subtree scan that recognizes a subdir Dockerfile HEALTHCHECK, a subdir package.json health signal, or a route.*
    handler inside a health/healthz/healthcheck directory.
  frontmatter:
    id: dec-247
    title: Make readiness healthcheck detection monorepo-aware (subdir-service + route-handler signals)
    status: accepted
    category: architectural
    date: 2026-06-20
    summary: Extend _detect_healthcheck beyond the root Dockerfile/package.json to a bounded subtree scan that recognizes a subdir Dockerfile HEALTHCHECK, a subdir package.json health signal, or a route.*
      handler inside a health/healthz/healthcheck directory.
    tags:
    - readiness
    - healthcheck
    - observability
    - monorepo
    - metrics
    - detector
    made_by: agent
    agent_type: orchestrator
    branch: feat-healthcheck-baseline
    pipeline_tier: standard
    affected_files:
    - scripts/project_metrics/collectors/readiness/checks.py
    - scripts/project_metrics/tests/test_readiness_checks.py
    dissent: A subtree scan adds per-run cost and false-positive surface (any route.* in a health-named dir counts, even a non-deployed example or a fixture); the root-only detector plus the readiness_config
      pillar-weight escape hatch already handles non-service repos without changing detection semantics for every project.
