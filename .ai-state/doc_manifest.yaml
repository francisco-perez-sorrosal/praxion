- id: ai-state-decisions-154-specialist-sub-architects-active-advocates
  path: .ai-state/decisions/154-specialist-sub-architects-active-advocates.md
  type: markdown
  title: "Specialist sub-architects are active quality advocates with standing \u2014 the orchestrator-mediated challenge loop"
  last_modified: '2026-05-12'
  renderer: adr_card
  summary: "A specialist sub-architect (interface-designer; candidate \u2014 context-engineer) is a quality advocate with standing, not a passive forward-only shadow. When an architectural decision constrains\
    \ a materially-better design in the specialist's domain, the specialist MUST register the objection in a dedicated Architecture Challenges section of its output; the orchestrator routes a substantive\
    \ challenge back to the systems-architect, who is obligated to re-evaluate and accept or reject with a reason; unresolved disagreement escalates to the user with both positions stated."
