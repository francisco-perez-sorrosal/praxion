- id: ai-state-decisions-189-hackathon-mode-activation-and-tier-integration
  path: .ai-state/decisions/189-hackathon-mode-activation-and-tier-integration.md
  type: markdown
  title: "Hackathon mode \u2014 flexible-entry Hackathon Spine, activation, and process integration"
  last_modified: '2026-05-15'
  renderer: adr_card
  summary: Hackathon mode replaces the 5-tier selector with a flexible-entry Hackathon Spine (fixed-order pipeline promethean -> researcher -> systems-architect -> implementation-planner -> implementer
    parallel test-engineer -> verifier) the user enters at a natural-language-inferred entry point, moves around in freely, and exits; everything upstream of the entry point is skipped, the verifier runs
    by default but is skippable, the auto-classifier is removed, and the safety net is skipped-rigor transparency (every skip and movement recorded in PROGRESS.md) rather than construction-guaranteed rigor.
    Activates through a four-channel signal (env var + CLAUDE.md block + praxion-rules preset + a praxion-hackathon CLI wrapper), keeps discovery full-strength while relaxing only delivery ceremony, and
    bundles the test-first relaxation into the same single switch.
  frontmatter:
