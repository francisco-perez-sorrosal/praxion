# Which roles receive their injected kernel, and the evidence for each step up.
# A role absent from `roles` is at no status: it receives nothing at spawn and its
# definition keeps the inherited project instructions. A role moves absent -> trial,
# then trial -> switched on a passing run, or trial -> held (a trial closed without a
# flip: a reason, its runs kept, nothing injected; held -> trial re-opens it with a
# later `since`). `since` is the moment its record began (an ISO
# instant, so a spawn earlier that day is not judged). Only the roles pinned in
# scripts/kernel_eligibility.py (ELIGIBLE_ROLES, the pin's home, changed only in a
# commit of its own) may be switched; this file lists none. The commit
# gate (scripts/check_kernel_manifest.py) holds every move.
# From v0.60.0 (dec-495) a held role's full arm is the split delivery: an inheriting
# praxion role receives the coordination protocol and the intermediate-documents rule
# without their orchestrator-only spans (claude/kernels/spawn_split.json). The runs below
# measured the full arm on the whole rules, so a re-trial from a later freeze compares its
# lean arm against the split, and its full-arm figures are not comparable with theirs. This
# note moves no role.
