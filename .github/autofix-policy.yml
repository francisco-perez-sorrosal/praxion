# Praxion's own ci-autofix policy — per-repo tunables read by the
# `reusable-ci-autofix.yml` hub, installed alongside `.github/workflows/ci-autofix.yml`
# (caller #1, dogfooding).
#
# The values P0 actually used — the main-branch fix-PR surface, the daily
# budget cap, sensitive paths, fixer model, and plugin_dir — are migrated 1:1
# from the P0 monolith this repo ran inline; the refactor to a thin caller
# changes WHERE those tunables live, not WHAT they are. As of P3a the
# `surfaces.pr_checks` / `surfaces.dependabot` / `surfaces.fork_prs` toggles and
# `safety.max_attempts_per_pr` are now LIVE — read by the hub's `classify` job
# and the new per-surface fix jobs. The `review` block remains documentary-only
# (P2 — designed, not yet built), as does `safety.auto_commit_tiers`. See
# `claude/project-baseline/ci-autofix/autofix-policy.yml.tmpl` for the full schema.

watched_workflows: [Test, Architecture]  # Documentary only — the caller's own
                                          # on.workflow_run.workflows is the
                                          # GHA-required static literal and is
                                          # authoritative. Keep this list in
                                          # sync with that literal by hand.

surfaces:
  main_branch: fix-pr       # P0's only behavior: open a fix PR on main-branch failure
  pr_checks:   fix-commit   # P3a — LIVE: fix-commit to a same-repo human PR's own branch
  dependabot:  fix-commit   # P3a — LIVE: fix-commit to a Dependabot PR's own branch
  fork_prs:    suggest      # P3a — LIVE: suggest-only patch comment (never a commit)

review:                        # Consumed by reusable-cross-model-review.yml
                                # (P2 — designed, not yet built). Documentary
                                # only in P1: the gate itself does not exist yet.
  cross_model_gate: agent-prs  # all-prs | agent-prs | off
  reviewer_family: gpt         # gpt | gemini | composer — NEVER 'claude': the
                                # fixer below is already claude, so the review
                                # gate must come from a different model family
                                # or it reviews nothing.
  on_unavailable: fail-open
  intake_gate: agent-issues    # agent-issues | all-issues | off — consumed by
                                # .github/workflows/issue-intake-assessment.yml,
                                # the cross-model INTAKE gate on filed
                                # ecosystem-defect issues (Praxion-only direct
                                # workflow, no PR context involved).
  project_prism: CLAUDE.md     # off disables — the shared, producer-free
                                # project prism (this repo's own CLAUDE.md,
                                # read as bounded base-ref DATA) both the
                                # intake gate above and the review gate read
                                # to judge fitness to THIS project.

safety:
  max_attempts_per_pr: 2    # P3a — LIVE: per-PR fix-commit attempt cap (counted
                             # via the `Autofix-Attempt:` commit trailer) that
                             # bounds the fix->fail-differently loop
  max_runs_per_day: 15      # daily budget cap — bumped from P0's 5 because the
                             # budget now aggregates across all four surfaces
                             # (main + pr_checks + dependabot + fork); a busy
                             # Dependabot day must not starve main-branch fixes
  sensitive_paths: [.github/, scripts/, hooks/]   # the P0 tripwire paths
  auto_commit_tiers: [lint, format, doc-refs, lockfile]   # P3 — reserved

provider:
  fixer: claude               # the only fixer wired in P1
  fixer_model: opus           # replaces P0's hardcoded --model opus literal
  plugin_dir: "."              # CRITICAL for Praxion specifically: Praxion IS
                               # a Claude Code plugin, so the hub's
                               # --plugin-dir flag must load "." to preserve
                               # the pre-hub dogfooding behavior of loading
                               # this repo's own skills/agents. Most managed
                               # repos should leave this unset/commented — see
                               # the template's own header for why this has NO
                               # default, unlike fixer/fixer_model above.
  js_test_runner: vitest      # dogfoods dashboard_app's own vitest suite so a
                               # JS/TS Dependabot bump can be verified, not just
                               # cleanly declined. See dec-draft-735a4612 for
                               # the residual-risk acceptance (--ignore-scripts
                               # closes install-time execution only). The
                               # install command itself is NOT selected by
                               # this enum — the hub DETECTS the package
                               # manager from js_project_dir's lockfile
                               # (dashboard_app/pnpm-lock.yaml selects a pnpm
                               # install via corepack), never a hardcoded
                               # `npm ci`.
  js_project_dir: dashboard_app  # Praxion's JS/TS project lives in this
                               # subdirectory, not the repo root — the vitest
                               # binary is at dashboard_app/node_modules/.bin/
                               # vitest, so both the install and runner
                               # commands need this `cd` prefix to resolve.
