  - { name: "category:agents",  color: "5319e7", description: "Ecosystem-defect category: agents" }
  - { name: "category:blocks",  color: "5319e7", description: "Ecosystem-defect category: blocks" }
  - { name: "category:hooks",   color: "5319e7", description: "Ecosystem-defect category: hooks" }
