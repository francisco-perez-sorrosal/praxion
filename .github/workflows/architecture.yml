# Architecture CI pipeline — enforces three independent properties on
# architectural-touch PRs:
#
#   1. regenerate-and-diff  — committed diagram renders match what likec4+d2
#                             would produce from source. Catches render drift.
#   2. fitness-functions    — import-linter contracts + pytest fitness suite
#                             pass. Catches boundary regressions.
#   3. dsl-validate         — AaC fence validator (mechanical, fast-fail) then
#                             architect-validator agent in --mode=pre-merge via
#                             claude-code-action (structural reasoning).
#
# Prerequisites:
#   CLAUDE_CODE_OAUTH_TOKEN — repository secret required by the dsl-validate job.
#   The same secret already powers claude-code-review.yml and claude.yml.
#
# Path filtering: this workflow runs ONLY on PRs (and pushes to main) that
# touch architectural-trigger paths. Non-architectural PRs never trigger it —
# no runner cost, no API spend. Path list mirrors the trigger globs in
# rules/writing/aac-dac-conventions.md and agents/architect-validator.md.
#
# See also: rules/writing/aac-dac-conventions.md (fence + golden-rule
# conventions), agents/architect-validator.md (pre-merge mode spec).

name: Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - '**/*.c4'
      - '**/DESIGN.md'
      - 'docs/architecture.md'
      - '.ai-state/decisions/**'
      - '.ai-state/CONSULT_*.md'
      # The five surfaces the discipline-registry invariants actually police.
      # Without them a PR touching only the registry or a contract site runs
      # ZERO fitness jobs — the gate-liveness scope-fidelity failure: correct
      # firing inside a narrower-than-documented scope still returns a false
      # "all clear" for everything outside it.
      - 'skills/multi-perspective-analysis/references/discipline-registry.md'
      - 'skills/software-planning/references/coordination-details.md'
      - 'agents/discipline-consultant.md'
      - 'agents/CLAUDE.md'
      - 'commands/consult.md'
      - 'fitness/**'
      - 'scripts/aac_fence_validator.py'
      - 'scripts/check_aac_golden_rule.py'
      # The regeneration command is an input to the render byte-diff: a change
      # to it can change every render, so it must trigger the drift gate.
      - 'scripts/regenerate_diagrams.py'
      - 'scripts/_diagram_*.py'
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - '**/*.c4'
      - '**/DESIGN.md'
      - 'docs/architecture.md'
      - '.ai-state/decisions/**'
      - '.ai-state/CONSULT_*.md'
      # The five surfaces the discipline-registry invariants actually police.
      # Without them a PR touching only the registry or a contract site runs
      # ZERO fitness jobs — the gate-liveness scope-fidelity failure: correct
      # firing inside a narrower-than-documented scope still returns a false
      # "all clear" for everything outside it.
      - 'skills/multi-perspective-analysis/references/discipline-registry.md'
      - 'skills/software-planning/references/coordination-details.md'
      - 'agents/discipline-consultant.md'
      - 'agents/CLAUDE.md'
      - 'commands/consult.md'
      - 'fitness/**'
      - 'scripts/aac_fence_validator.py'
      - 'scripts/check_aac_golden_rule.py'
      # The regeneration command is an input to the render byte-diff: a change
      # to it can change every render, so it must trigger the drift gate.
      - 'scripts/regenerate_diagrams.py'
      - 'scripts/_diagram_*.py'

permissions: {}  # least-privilege; jobs below add only what they need

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: regenerate-and-diff
  #
  # Verifies that the committed diagram renders are what the regeneration
  # command produces from the source .c4 files with the pinned toolchain.
  #
  # Shape (the managed-project template mirrors it): install the two pinned
  # tools, regenerate in place with `python3 scripts/regenerate_diagrams.py`,
  # fail on any change under docs/diagrams/, then show the diff. The comparison
  # lives in its own steps so the regeneration step is the command alone.
  # The pre-commit hook (scripts/diagram-regen-hook.sh) runs the same command
  # with `--staged`; here nothing is staged, so the default mode regenerates
  # every diagram root. Review-check findings are printed, never enforced here.
  # ---------------------------------------------------------------------------
  regenerate-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv (manages Python 3.13)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          # This job installs likec4 (npm) + d2 (curl), never a uv dependency,
          # so the uv cache stays empty and setup-uv's post-step `cache prune`
          # fails the job with "Cache path does not exist". Disable caching
          # where there is nothing to cache.
          enable-cache: false

      - name: Install likec4
        # Pinned to the maintained `likec4` package. The org-scoped
        # `@likec4/cli` is a frozen pre-1.0 distribution (last release v0.40.0,
        # 2023) whose CLI lacks the current command surface — installing it
        # made this job fail on every run. The version must equal the pin
        # stated in scripts/regenerate_diagrams.py, which refuses any other.
        run: npm install -g likec4@1.59.4

      - name: Install d2
        # Pinned for GEOMETRY stability: a different d2 version can lay diagrams
        # out differently, which would legitimately change the rendered SVG.
        # The binary is the release tarball of exactly this version, verified
        # against that tarball's SHA-256 before it is installed, so neither an
        # installer script fetched from a moving branch nor a runner's Homebrew
        # state decides which d2 runs. The version stamp d2 writes into each SVG
        # varies by build provenance ("0.7.1" from Homebrew, "v0.7.1" from this
        # tarball); the regeneration command scrubs it, so a local render and
        # this one compare equal.
        run: |
          version=v0.7.1
          tarball="d2-${version}-linux-amd64.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/terrastruct/d2/releases/download/${version}/${tarball}"
          echo "eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}"
          sudo install -m 755 "d2-${version}/bin/d2" /usr/local/bin/d2
          rm -r "${tarball}" "d2-${version}"

      - name: Regenerate diagrams
        # Default mode: every diagram root under docs/diagrams/, rendered in
        # place into its rendered/ directory. A regeneration failure exits 1
        # with the failing step's message; findings print without failing.
        run: python3 scripts/regenerate_diagrams.py

      - name: Fail on renders that differ from the committed ones
        run: |
          changes="$(git status --porcelain -- docs/diagrams/)"
          if [ -n "${changes}" ]; then
            echo "${changes}"
            echo "::error::Committed diagram renders differ from a fresh regeneration. Run python3 scripts/regenerate_diagrams.py with the pinned toolchain and commit docs/diagrams/."
            exit 1
          fi

      - name: Show the render diff
        # Display only: runs after the step above failed, so the log shows what drifted.
        if: failure()
        run: git diff --exit-code -- docs/diagrams/

  # ---------------------------------------------------------------------------
  # Job 2: fitness-functions
  #
  # Runs the architectural fitness suite: pytest tests that enforce structural
  # invariants (meta-citation rule, starter contract) plus import-linter
  # boundary checks from fitness/import-linter.cfg.
  # ---------------------------------------------------------------------------
  fitness-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 is load-bearing, not hygiene. The sealed-prior gate's
          # witness check resolves `git show <seal-witness>:.ai-state/CONSULT_PRIORS.md`
          # against a commit that predates the PR head. Under the default shallow
          # clone that commit is unreachable, and the test SKIPS with "shallow
          # clone, or the branch was squash-merged" — so the tamper-evidence
          # claim would hold only for the convener's local run, never in CI.
          fetch-depth: 0

      - name: Set up uv (manages Python 3.13)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Fitness pytest suite
        run: uv run pytest fitness/tests/ -q

      - name: Import-linter boundary check
        # praxion_evals is a root package living in a sibling project this
        # environment does not install; the graph builder parses rather than
        # executes, so the source tree only needs to be findable. Omitting this
        # fails loudly rather than dropping the contract. See the cfg header.
        env:
          PYTHONPATH: eval/src
        run: uv run lint-imports --config fitness/import-linter.cfg --no-cache

  # ---------------------------------------------------------------------------
  # Job 3: dsl-validate
  #
  # Three-phase: (a) mechanical AaC fence validator runs first (fast-fail before
  # API spend), then (b) architect-validator agent in --mode=pre-merge via
  # claude-code-action for structural reasoning (model↔code drift, ADR↔model
  # drift, generated-region drift), then (c) a render-and-gate step that is the
  # named reader of (b)'s verdict — it publishes the report to the job summary
  # and is what actually fails the job on a FAIL verdict. The agent has no shell
  # and cannot set an exit code, so without (c) this job is advisory in practice
  # however the validator votes.
  #
  # AAC_FENCE_VALIDATOR_LIKEC4=disabled: the fence validator's likec4-dependent
  # path is skipped in CI where likec4 is not installed; fence balance and
  # attribute checks still run.
  # ---------------------------------------------------------------------------
  dsl-validate:
    # PR-only: the architect-validator step uses claude-code-action, whose
    # event allowlist rejects `push` ("Unsupported event type: push"), and its
    # prompt needs `github.event.pull_request.number`, which is empty on push.
    # The mechanical jobs above still run on push to main; this agent gate is
    # inherently pre-merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write  # required by claude-code-action for OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.13)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          # This job runs the mechanical AaC validator and the architect-validator
          # agent, neither of which populates a uv dependency cache, so setup-uv's
          # post-step `cache prune` fails the job with "Cache path does not exist".
          # Disable caching where there is nothing to cache.
          enable-cache: false

      - name: Validate AaC fences (mechanical, fast-fail)
        env:
          AAC_FENCE_VALIDATOR_LIKEC4: disabled
        run: |
          find . -path ./.git -prune -o \
            \( -name 'DESIGN.md' -o -path './docs/architecture.md' \) \
            -print 2>/dev/null \
            | xargs -r -I {} python3 scripts/aac_fence_validator.py {}

      - name: Architect-validator pre-merge sweep
        id: validator
        # Fixed 2026-07-22 (dec-draft-0d0e21b7): the agent's documented pre-merge
        # protocol runs `uv run lint-imports` and `python3 scripts/aac_fence_validator.py`
        # and prefers the likec4 MCP (absent in CI). With those commands denied by a
        # too-narrow allowlist, the agent burned all 15 turns on permission denials and
        # failed CLOSED with no verdict (it flaked on main too, on doc-heavy PRs). The
        # allowlist below now matches the protocol, the turn budget is raised, and the
        # likec4 binary is disabled so the agent takes its documented no-likec4 fallback.
        #
        # No `Write` is granted, and that is deliberate rather than an oversight. A
        # report written here dies with the runner: pre-merge has no task slug, no step
        # uploads the file, and nothing reads it back. `--json-schema` gives the same
        # report a transport that outlives the step —
        # `steps.validator.outputs.structured_output` — which the gate step below
        # renders into the job summary and acts on. The schema mirrors the report
        # structure documented in agents/architect-validator.md (three sections, the
        # finding fields, three verdicts); the two must be changed together.
        #
        # continue-on-error: an exhausted quota surfaces as either a non-zero exit or
        # an exit-0 run with empty output, and the action also errors when the model
        # returns nothing schema-conforming. None of those is structural drift, so none
        # may redden the PR — the gate step distinguishes "no verdict" from "FAIL".
        continue-on-error: true
        env:
          AAC_FENCE_VALIDATOR_LIKEC4: disabled
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Load the praxion:architect-validator agent. Run in --mode=pre-merge
            for PR #${{ github.event.pull_request.number }} on ${{ github.repository }}.

            Steps:
            1. Read agents/architect-validator.md for the full pre-merge protocol
            2. Identify all architectural files changed in this PR:
               run `git diff --name-only origin/${{ github.base_ref }}...HEAD`
            3. For each changed DESIGN.md or .c4 file, run the pre-merge
               checks defined in the agent: model↔code drift, ADR↔model drift,
               generated-region drift, fence validity
            4. For changes to .ai-state/decisions/**, verify ADR cross-references
               are consistent with the model
            5. Return the report as JSON matching the supplied schema: the
               overall verdict, a one-paragraph summary, and one entry per
               finding. You have no shell and no exit mechanism here, so do not
               try to fail the job yourself — this job gates on your `verdict`
               field, and a `FAIL` verdict is what blocks the merge.

            SCOPE: Only files changed in this PR. Do not re-audit unchanged files.
            CONFIDENCE: HIGH findings only. Do not report stylistic issues.
          claude_args: |
            --plugin-dir .
            --model opus
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(find:*),Bash(uv run lint-imports:*),Bash(python scripts/aac_fence_validator.py:*),Bash(python3 scripts/aac_fence_validator.py:*)"
            --json-schema '{"type":"object","required":["verdict","summary","findings"],"properties":{"verdict":{"type":"string","enum":["PASS","PASS_WITH_WARNINGS","FAIL"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","required":["severity","code","detail"],"properties":{"severity":{"type":"string","enum":["FAIL","WARN","PASS","INFO"]},"section":{"type":"string","enum":["model-to-code","adr-to-model","generated-region"]},"code":{"type":"string"},"location":{"type":"string"},"detail":{"type":"string"},"suggested_action":{"type":"string"}}}}}}'

      # The named reader for the validator's findings, and the only thing in this
      # job that can turn one into a red check. Without it the agent's report has no
      # consumer at all: nothing reads structured_output, nothing comments on the PR,
      # and the agent cannot set an exit code (its allowlist grants no shell) — so the
      # job would stay green whatever the validator found, which is indistinguishable
      # from not running it.
      #
      # No PR comment and no `pull-requests: write`: the job summary is reachable from
      # the PR's own check list, and a red check with a rendered summary is already in
      # front of the reviewer. Escalating the token's write scope on a workflow that
      # loads the plugin and runs Opus would buy prominence at a real cost.
      #
      # GOLDEN BAD CASE for the gate below — runnable as-is:
      #   echo '{"verdict":"FAIL"}'               | jq -e '.verdict != "FAIL"'  # exit 1
      #   echo '{"verdict":"PASS_WITH_WARNINGS"}' | jq -e '.verdict != "FAIL"'  # exit 0
      # Unparseable JSON also exits non-zero: a gate fails closed on garbage. The one
      # case it deliberately does NOT block on is an *empty* output, handled above the
      # gate as a loud advisory — that means the check never ran, not that it passed.
      - name: Render verdict and gate on structural drift
        env:
          VALIDATOR_OUTPUT: ${{ steps.validator.outputs.structured_output }}
        run: |
          if [ -z "${VALIDATOR_OUTPUT}" ]; then
            {
              echo "## :warning: Architecture validation did not run (advisory)"
              echo
              echo "The architect-validator returned no verdict — an exhausted subscription"
              echo "quota, or claude-code-action declining this PR. The mechanical jobs in"
              echo "this workflow still gated it, but the **structural check did not happen**."
              echo "This step does not block the PR on infrastructure failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::architect-validator returned no verdict; structural validation was skipped for this PR"
            exit 0
          fi

          printf '%s' "${VALIDATOR_OUTPUT}" > architecture-validation.json

          jq -r '
            "# Architecture Validation Report",
            "",
            "**Verdict:** \(.verdict)",
            "",
            "\(.summary)",
            "",
            "## Findings",
            "",
            if (.findings | length) == 0 then "None reported."
            else (.findings[] |
              "### [\(.severity)] `\(.code)`",
              (if .section then "**Section:** \(.section)" else empty end),
              (if .location then "**Location:** `\(.location)`" else empty end),
              "",
              "\(.detail)",
              (if .suggested_action then "\n**Suggested action:** \(.suggested_action)" else empty end),
              "")
            end
          ' architecture-validation.json >> "$GITHUB_STEP_SUMMARY" \
            || echo "_Validator output was not renderable as the expected report shape._" >> "$GITHUB_STEP_SUMMARY"

          if ! printf '%s' "${VALIDATOR_OUTPUT}" | jq -e '.verdict != "FAIL"' > /dev/null 2>&1; then
            echo "::error::Architecture validation verdict is FAIL — structural drift detected. See the job summary for the findings."
            exit 1
          fi
