# CI Autofix — Praxion's own caller (caller #1) of the public
# `reusable-ci-autofix.yml` hub.
#
# This file used to be the P0 monolith: the full checkout/budget/dedup/
# fetch/diagnose/tripwire pipeline ran inline here as a `steps:` job. It has
# been refactored into a thin caller — every piece of that logic now lives in
# the hub (`.github/workflows/reusable-ci-autofix.yml`), generalized to read
# its tunables from a per-repo `autofix-policy.yml` instead of hardcoded
# constants. This file owns only the trigger and the least-privilege
# permissions ceiling; see the hub for the diagnose-and-fix logic and the
# safety machinery around it, and see `.github/autofix-policy.yml` for
# Praxion's own tunables (budget caps, sensitive paths, fixer model, review
# policy).
#
# Praxion is caller #1 (dogfooding) and differs from every other managed
# caller installed by `/onboard-project` in one deliberate way: the `uses:`
# below is a same-repo local ref (`./...`, tracks HEAD — correct for the repo
# that develops the hub), never a cross-repo SHA pin. It also maps
# CLAUDE_CODE_OAUTH_TOKEN via an explicit `secrets:` mapping rather than the
# blanket inherit-all shorthand, exercising the same cross-org auth path every
# managed caller relies on (even though, being same-repo, the shorthand would
# also work here — the explicit mapping is the one the hub's contract
# requires and the one this repo verifies).
#
# Trigger: the `workflow_run` event fires when a watched workflow finishes.
# The hub's own `if:` gates on `conclusion == failure` AND the caller repo's
# actual default branch, and owns the concurrency group and every
# loop-prevention layer (dedup, actor-guard, `ci-autofix/` branch-prefix
# exclusion) — see that file's header for the full inventory.
#
# Prerequisites:
#   CLAUDE_CODE_OAUTH_TOKEN — repository secret (already powers claude.yml,
#   claude-code-review.yml, architecture.yml).
#   The Claude GitHub app (github.com/apps/claude) must be installed so the
#   agent authenticates as the app — PRs it opens then trigger CI and
#   self-validate. `id-token: write` enables the OIDC exchange.

name: CI Autofix

on:
  workflow_run:
    workflows: ["Test", "Architecture"]
    types: [completed]

permissions: {}  # least-privilege; the job below adds only what the hub needs

jobs:
  autofix:
    permissions:                          # ceiling GitHub caps the hub's
                                           # effective token at — an
                                           # under-scoped grant here silently
                                           # starves the hub's PR-open step
      contents: write       # create the ci-autofix/ branch
      pull-requests: write  # open the fix PR
      actions: read         # read the failed run's logs
      id-token: write       # OIDC — lets claude-code-action auth as the Claude app
    uses: ./.github/workflows/reusable-ci-autofix.yml
    with:
      policy_path: .github/autofix-policy.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
