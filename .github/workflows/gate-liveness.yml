# Gate liveness — the weekly proof that the gates still bite on known input.
# Five jobs, one per kind of check (the whole-suite scenarios are split in two to
# stay under the 240-minute ceiling below), so each gets a time limit that fits it
# and none hides another's conclusion (no job waits on, or is conditional on, another).
# Every job's red is news:
#
#   fast-probes           three quick probes of `scripts/check_gates_bite.py`
#                         (mutation-sensor, observation-hooks, spawn-count)
#   selection-audit       the fourth probe, the selection audit, which runs the
#                         traced default suite and so needs a limit of its own
#   scenarios-quick       the `liveness`-marked scenarios under tests/acceptance
#   scenarios-whole-suite the `liveness`-marked scenarios under tests/e2e, most
#                         of which run the whole traced suite, except the two
#                         that need the audit to pass
#   scenarios-whole-suite-audit-gated
#                         those two, apart, so their red hides no other
#                         scenario's; each whole-suite job deselects the other's
#                         nodes, so a scenario added later runs in both until it
#                         is placed in one and the limits are re-sized
#
# Every job holds a read-only grant and no secret, starts no assistant session,
# and gives each pytest invocation one tree (tests/ and fitness/tests/ never
# share one, td-302). A scenarios job records each scenario's duration and the
# free disk through `scripts/liveness_scenario_record.py`, and its report step
# runs whatever happened to the scenarios, so a scenario cut by a time limit
# still shows how long it ran.
#
# Each job's limit carries one comment line directly above it, naming the
# reading it was sized from:
#   # sized: measured=<date> commit=<12 hex> where=<local|runner> step=<s>s
#   #        scale=<factor> setup=<s>s fixed=<s>s margin=1.5 limit=<n>min
# (one physical line in practice; the audit job's line adds `bound=<s>s`, the
# bound declared in pyproject.toml). The limit is
#   max(10, ceil((1.5 x (step x scale + setup) + fixed) / 60))
# minutes: the margin covers the scaled step and the runner's setup, `fixed` is
# an unmeasured allowance added unmargined, and no limit is under 10 minutes
# since the runner's own setup varies by minutes. No limit passes 240; a job
# whose limit would pass it is split. A run in which a job used more than 80 percent of
# its limit, or the audit's traced suite more than 80 percent of its bound, re-sizes
# that limit from that run's own readings (`where=runner scale=1`). A line that reads
# `pending` is refused by `tests/test_gate_liveness_workflow_invariants.py`, so a
# placeholder cannot survive to merge. Each reading is on its job's `# sized:` line:
# taken locally and scaled to the runner by the root suite's ratio, or taken on the
# runner when a run re-sized it (the audit's, 2026-11-20: its traced suite ran
# 3075 s of the 3540 s bound sized locally).
#
# No workflow watches this one: `ci-autofix.yml` watches exactly Test,
# Architecture and Test (scheduled). A red liveness run says a gate no longer
# bites, a finding for a person to read, not a failure to patch automatically.
#
# Actions are SHA-pinned per security convention (dec-024).

name: Gate liveness

on:
  schedule:
    - cron: "47 5 * * 1"  # weekly, Monday 05:47 UTC — off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-liveness
  cancel-in-progress: false

jobs:
  fast-probes:
    name: Gate liveness, fast probes
    runs-on: ubuntu-latest
    # The floor of 10 minutes governs: the scaled reading is under one minute.
    # sized: measured=2026-11-19 commit=ea85b08d52ea where=local step=7.6s scale=1.53 setup=10s fixed=0s margin=1.5 limit=10min
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.11)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      # Exit 1 when any of these gates no longer bites, naming what each probe
      # expected and observed.
      - name: Prove each fast gate still bites
        run: .venv/bin/python scripts/check_gates_bite.py --gate mutation-sensor --gate observation-hooks --gate spawn-count

  selection-audit:
    name: Gate liveness, selection audit
    runs-on: ubuntu-latest
    # fixed is the gate command's own allowance beyond the declared bound, added unmargined.
    # sized: measured=2026-11-20 commit=627a82f221fd where=runner step=3200.1s scale=1 setup=14s fixed=360s margin=1.5 limit=87min bound=4620s
    timeout-minutes: 87
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.11)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      # tmp/ is gitignored, so a fresh checkout has none, and the command
      # refuses a report directory that does not exist.
      - name: Make the verdict's directory
        run: mkdir -p tmp

      # The command holds the audit to the bound declared in pyproject.toml;
      # a red here is the job's red and the run's red.
      - name: Prove the selection audit still bites
        run: .venv/bin/python scripts/check_gates_bite.py --gate selection-audit --json-report tmp/selection-audit-verdict.json

      - name: Upload the audit's verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: selection-audit-verdict
          path: tmp/selection-audit-verdict.json
          if-no-files-found: warn
          retention-days: 30

  scenarios-quick:
    name: Gate liveness, quick scenarios
    runs-on: ubuntu-latest
    # sized: measured=2026-11-23 commit=97543a08a86c where=local step=1103s scale=1.53 setup=10s fixed=0s margin=1.5 limit=43min
    timeout-minutes: 43
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.11)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Free disk space before the scenarios
        run: python3 scripts/liveness_scenario_record.py disk

      # The last -m wins over the runner config's -m 'not large and not liveness'.
      # The step limit sits two minutes under the job's, so a cut leaves time
      # for the report.
      - name: Run the quick liveness scenarios
        timeout-minutes: 41
        run: .venv/bin/python -m pytest -m liveness tests/acceptance -n 0 --no-cov -p no:cacheprovider -p scripts.liveness_scenario_record --liveness-record=tmp/liveness-scenarios.jsonl

      - name: Report each scenario's duration and the free disk
        if: always()
        run: python3 scripts/liveness_scenario_record.py report tmp/liveness-scenarios.jsonl

  scenarios-whole-suite:
    name: Gate liveness, whole-suite scenarios
    runs-on: ubuntu-latest
    # fixed is the allowance for freeing the runner's toolchains, unmeasured and added unmargined;
    # step is the sum of this job's scenario durations plus the one pytest session overhead of 200.2 s.
    # sized: measured=2026-11-19 commit=ea85b08d52ea where=local step=5164.8s scale=1.53 setup=10s fixed=180s margin=1.5 limit=201min
    timeout-minutes: 201
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.11)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      # Each scenario clones the checkout and runs the suite in the clone, and a clone
      # holds its pytest roots after it ends: the local peak (an upper bound of about
      # 28 GiB) is past the runner's free disk, so the preinstalled toolchains this
      # repository never uses go first.
      - name: Remove the runner's unused toolchains
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Free disk space before the scenarios
        run: python3 scripts/liveness_scenario_record.py disk

      # The last -m wins over the runner config's -m 'not large and not liveness'.
      # The step limit sits two minutes under the job's, so a cut leaves time
      # for the report.
      - name: Run the whole-suite liveness scenarios
        timeout-minutes: 199
        run: >-
          .venv/bin/python -m pytest -m liveness tests/e2e -n 0 --no-cov -p no:cacheprovider
          -p scripts.liveness_scenario_record --liveness-record=tmp/liveness-scenarios.jsonl
          --deselect=tests/e2e/test_gate_liveness_run.py::test_every_liveness_check_passes_on_this_change_and_leaves_no_trace
          --deselect=tests/e2e/test_gate_liveness_run.py::test_a_dead_gate_fails_its_own_check_while_the_other_three_still_run_and_pass

      - name: Report each scenario's duration and the free disk
        if: always()
        run: python3 scripts/liveness_scenario_record.py report tmp/liveness-scenarios.jsonl

  scenarios-whole-suite-audit-gated:
    name: Gate liveness, whole-suite scenarios that need a passing audit
    runs-on: ubuntu-latest
    # fixed is the allowance for freeing the runner's toolchains, unmeasured and added unmargined;
    # step is the sum of this job's scenario durations plus the one pytest session overhead of 200.2 s.
    # sized: measured=2026-11-19 commit=ea85b08d52ea where=local step=3426.4s scale=1.53 setup=10s fixed=180s margin=1.5 limit=135min
    timeout-minutes: 135
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (manages Python 3.11)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      # Each scenario clones the checkout and runs the suite in the clone, and a clone
      # holds its pytest roots after it ends: the local peak (an upper bound of about
      # 28 GiB) is past the runner's free disk, so the preinstalled toolchains this
      # repository never uses go first.
      - name: Remove the runner's unused toolchains
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Free disk space before the scenarios
        run: python3 scripts/liveness_scenario_record.py disk

      # The last -m wins over the runner config's -m 'not large and not liveness'.
      # The step limit sits two minutes under the job's, so a cut leaves time
      # for the report.
      - name: Run the whole-suite liveness scenarios
        timeout-minutes: 133
        run: >-
          .venv/bin/python -m pytest -m liveness tests/e2e -n 0 --no-cov -p no:cacheprovider
          -p scripts.liveness_scenario_record --liveness-record=tmp/liveness-scenarios.jsonl
          --deselect=tests/e2e/test_gate_liveness_run.py::test_audit_fails_on_unanticipated_reads_and_repeats_its_findings_exactly
          --deselect=tests/e2e/test_gate_liveness_run.py::test_resolver_that_selects_nothing_fails_the_audit
          --deselect=tests/e2e/test_gate_liveness_run.py::test_missing_resolver_fails_the_audit_and_says_why
          --deselect=tests/e2e/test_selection_audit_job_reports_its_red.py::test_a_failing_audit_job_logs_what_it_expected_what_it_observed_and_each_unselected_read

      - name: Report each scenario's duration and the free disk
        if: always()
        run: python3 scripts/liveness_scenario_record.py report tmp/liveness-scenarios.jsonl
