# Release workflow -- manual-only stable releases via workflow_dispatch.
#
# Commitizen computes the proper semver bump from conventional commits since the
# last stable tag and, in a SINGLE bump commit, updates the version files AND
# regenerates CHANGELOG.md (update_changelog_on_bump = true in pyproject.toml),
# then tags that commit -- so the release tag points at a tree that already
# documents its own version. The workflow then pushes and publishes the GitHub
# release. cz bump is the only mechanism that changes version strings; this
# workflow_dispatch is the only sanctioned way to invoke it (the /release command
# dispatches this workflow rather than bumping locally).

name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Bump type (auto = detect from conventional commits)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, changelog, and tag
        id: cz
        run: |
          # update_changelog_on_bump = true folds CHANGELOG.md into this single
          # bump commit, which is then tagged -- so the tag includes its changelog.
          if [ "${{ inputs.increment }}" = "auto" ] || [ -z "${{ inputs.increment }}" ]; then
            cz bump --yes 2>&1 | tee bump_output.txt
          else
            cz bump --yes --increment "$(echo '${{ inputs.increment }}' | tr '[:lower:]' '[:upper:]')" 2>&1 | tee bump_output.txt
          fi
          echo "version=$(cz version --project)" >> $GITHUB_OUTPUT

      - name: Push with tags
        run: git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.cz.outputs.version }}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi
          # Extract this version's section from CHANGELOG.md for the release body
          BODY=$(sed -n "/^## $VERSION/,/^## v/{/^## v[^$]/!p;}" CHANGELOG.md | sed '1d')
          gh release create "$VERSION" --title "$VERSION" --notes "$BODY"
