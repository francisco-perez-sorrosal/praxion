# Test workflow -- runs ruff format/lint + pytest on both MCP servers via a
# matrix strategy. Actions are SHA-pinned per security convention (see
# dec-024). Python is managed by astral-sh/setup-uv.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project: [task-chronograph-mcp, eval]

    concurrency:
      group: test-${{ github.ref }}-${{ matrix.project }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv (manages Python 3.13)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync

      - name: Ruff format check
        working-directory: ${{ matrix.project }}
        run: uv run ruff format --check

      - name: Ruff lint
        working-directory: ${{ matrix.project }}
        run: uv run ruff check

      - name: Pyright type check
        working-directory: ${{ matrix.project }}
        run: uv run pyright src/

      - name: Pytest
        working-directory: ${{ matrix.project }}
        run: uv run pytest

  validate-context-artifacts:
    # Soft-launch (SYSTEMS_PLAN.md §4.4): continue-on-error for the first
    # 14 days; follow-up PR flips to strict on 2026-04-30.
    name: Validate Context Artifacts (soft-launch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv (manages Python 3.13)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"

      - name: Cross-reference validation
        run: python skills/skill-crafting/scripts/validate_references.py --all --format text

  shipped-artifact-isolation:
    # Hard gate: blocks PRs that leak specific .ai-state/ or .ai-work/
    # entries into shipped surfaces (rules/, skills/, agents/, commands/,
    # claude/config/). See rules/swe/shipped-artifact-isolation.md.
    name: Shipped artifact isolation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Shipped-artifact isolation check
        run: python3 scripts/check_shipped_artifact_isolation.py

  release-staleness:
    # Advisory (never blocks): after a merge lands on main, report agents /
    # skills / commands added since the last v* release tag -- they are
    # invisible to marketplace installs until a release is cut. The frozen
    # 0.2.0 cache (interface-designer not registering) is the failure this
    # surfaces. Push-only: noisy on PRs, meaningful post-merge on main.
    name: Release staleness (advisory)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # full history + tags so `git describe` resolves the last release

      - name: Report unreleased artifacts
        run: python3 scripts/check_release_staleness.py
