# Praxion's own commit gate.
#
# Unifies the standard baseline Praxion ships to managed projects
# (claude/project-baseline/pre-commit-config.yaml — UNIVERSAL file-hygiene +
# gitleaks + PYTHON ruff) with the six Praxion-author gates that formerly lived
# in the bespoke scripts/git-pre-commit-hook.sh (now retired). Each author block
# is re-expressed as a repo:local hook invoking the same checker script with the
# same staged-file filter — behavior-preserving by construction.
#
# Activate once with `pre-commit install` (install_claude.sh runs this). Bump
# rev: pins in lock-step with the project-baseline asset.
#
# `default_install_hook_types` makes a plain `pre-commit install` register the
# commit-msg stage too (Block L below); without it that gate is configured but
# never runs, which is the dead-gate shape check_gate_liveness exists to catch.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # --- UNIVERSAL (mirrors the shipped canonical baseline) ----------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Generated project-intelligence artifacts under .ai-state/ are
        # intentionally large (full per-file metrics + readiness payloads) and
        # committed by convention; the guard targets accidental source blobs.
        #
        # The alternation must track new report families -- it is an enumeration,
        # so a family this list has not heard of is silently in scope rather than
        # silently out of it. That fails in the safe direction (a real blob is
        # still caught), but it surfaces as a confusing block on a legitimate
        # artifact. `praxion_eval_reports` was added 2026-08-07 when the first
        # full LLM-tier /eval-praxion run produced a 696 KB report: 1,343 checks
        # each carrying its own judge rationale. Same class as the two families
        # already listed, and the same reason.
        exclude: '^\.ai-state/(metrics_reports|sentinel_reports|praxion_eval_reports)/.*\.(json|md)$'
      - id: check-merge-conflict
      - id: detect-private-key
        # `secret-patterns.md` is a catalog of what secrets *look like*, for a
        # skill whose subject is sanitizing them before an upstream report. Its
        # PEM header sits in a fenced "Before" example whose body is the literal
        # ellipsis `MIIEowIBAAKCAQEA... (multiple lines)` -- a shape, not a key.
        # The pattern predates this exclusion and only surfaced when the file was
        # first staged since the hook was added; gitleaks scans it clean.
        exclude: '^skills/upstream-stewardship/references/secret-patterns\.md$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks  # secret scanner — blocks committed credentials/tokens

  # --- PIN COHERENCE (must precede the formatter it protects) ------------------
  # Placed BEFORE the ruff hooks deliberately. If the pinned and installed ruff
  # disagree, the failure a developer sees is a commit that will not settle:
  # the hook reformats, they reformat back, `git add` never captures a stable
  # state, and pre-commit's stash/restore around each failed attempt can
  # silently revert work. Reporting the version mismatch FIRST names the cause;
  # letting ruff run first shows only the confusing symptom.
  - repo: local
    hooks:
      - id: ruff-pin-drift
        name: ruff pin coherence
        entry: python3 scripts/check_ruff_pin_drift.py --repo-root .
        language: system
        # always_run: drift appears when someone upgrades their ruff, with no
        # file staged to trigger a path filter. A `files:` pattern here would
        # miss the most common way this breaks.
        always_run: true
        pass_filenames: false

  # --- PYTHON (reads [tool.ruff] from the ROOT pyproject.toml) -----------------
  # Scope: the root Python surface only. `eval/` and `task-chronograph-mcp/` are
  # self-contained subpackages -- each carries its own pyproject.toml with its own
  # [tool.ruff] block (target-version py313, vs the root's py311) and is gated by
  # its own `uv run ruff format --check` + `ruff check` step in the test workflow's
  # per-project matrix.
  #
  # Formatting them from here is not merely redundant, it is actively breaking:
  # this hook runs a DIFFERENT ruff (pinned below) against a DIFFERENT
  # target-version than the subpackage's own gate. The two disagree on assertion
  # wrapping, so every commit touching a subpackage .py file would be reformatted
  # here and then rejected by that subpackage's CI -- a loop no amount of
  # re-staging can settle, because each side is correct by its own config.
  # Each subpackage owns its formatting; this hook owns the root surface.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(eval|task-chronograph-mcp)/
      - id: ruff-format
        exclude: ^(eval|task-chronograph-mcp)/

  # --- PRAXION AUTHOR GATES (retired scripts/git-pre-commit-hook.sh Blocks A–E)-
  # repo:local hooks reproduce each block's exact (staged-file filter → checker →
  # pass/fail) tuple. The checker scripts are unchanged; only the dispatcher
  # changed (pre-commit instead of the shell hook).
  - repo: local
    hooks:
      # Block A — shipped-artifact isolation. The script re-filters to shipped
      # surfaces and excludes test fixtures; --files receives the matched paths.
      - id: shipped-artifact-isolation
        name: Shipped-artifact isolation
        entry: python3 scripts/check_shipped_artifact_isolation.py --repo-root . --files
        language: system
        files: '^(rules|skills|agents|commands|claude/config|claude/canonical-blocks)/.*\.md$'
        exclude: '/tests/fixtures/'
        pass_filenames: true

      # Block B — canonical-block sync. Whole-repo --check; fires only when a
      # canonical block or the onboarding skill's consolidated
      # claude-md-blocks.md consumer is staged.
      - id: canonical-block-sync
        name: Canonical-block sync
        entry: python3 scripts/sync_canonical_blocks.py --check
        language: system
        files: '^(claude/canonical-blocks/.*\.md|skills/onboard-project/references/claude-md-blocks\.md)$'
        pass_filenames: false

      # Block B2 — canonical-block history-manifest liveness. Whole-repo
      # --check-history; fires only when a canonical block, the generated
      # history manifest, or the generator/identity scripts are staged. One
      # concern per hook (sibling to canonical-block-sync, not merged into it).
      - id: canonical-block-history
        name: Canonical-block history-manifest liveness
        entry: python3 scripts/sync_canonical_blocks.py --check-history
        language: system
        files: '^(claude/canonical-blocks/.*\.(md|json)|scripts/(sync_canonical_blocks|canonical_block_identity)\.py)$'
        pass_filenames: false

      # Block B3 — shipped-template mirror sync. Same defect class as Block B
      # on a different surface: `claude/aac-templates/fitness-conftest.py.tmpl`
      # is copied verbatim into every managed project by /onboard-project Phase
      # 8b.2, and this repo carries the installed counterpart as its dogfooding
      # instance. Nothing but this gate keeps the two equal. Sibling of
      # canonical-block-sync rather than merged into it — one concern per hook,
      # and the two registries have no overlap.
      #
      # `files:` MUST list BOTH halves of every pair: drift is created by
      # editing either side, and a pattern covering only the template would be
      # blind to the far more common motion (someone improves the live fitness
      # conftest and never opens the template). A test asserts this pattern
      # matches every registered path, so adding a mirror row without widening
      # the pattern fails rather than silently shipping an ungated pair.
      - id: template-mirror-sync
        name: Shipped-template mirror sync
        entry: python3 scripts/check_template_mirrors.py --check
        language: system
        files: '^(fitness/tests/conftest\.py|claude/aac-templates/fitness-conftest\.py\.tmpl)$'
        pass_filenames: false

      # Block C — diagram regeneration. Self-discovers staged .c4; skips when
      # likec4/d2 are absent.
      - id: diagram-regen
        name: Diagram regeneration
        entry: scripts/diagram-regen-hook.sh
        language: system
        files: '\.c4$'
        pass_filenames: false

      # Block D — AaC golden-rule gate. Self-discovers staged architectural
      # surfaces via --mode=gate.
      - id: aac-golden-rule
        name: AaC golden-rule gate
        entry: python3 scripts/check_aac_golden_rule.py --mode=gate
        language: system
        files: '^(docs/diagrams/|.*\.c4$|.*ARCHITECTURE\.md$|docs/architecture\.md$)'
        pass_filenames: false

      # Architecture projection — DESIGN.md must project both authorities: the
      # LikeC4 model (section 3a components) and the shipped-block registry
      # (section 4 canonical blocks). Fires on any of the three, since drift is
      # created by editing one without the others — adding a canonical block
      # touches neither the model nor DESIGN.md, so that path must be in scope
      # or the gate is blind to it. Stdlib-only, so language: system is safe.
      - id: architecture-projection
        name: Architecture projection (model + shipped blocks <-> DESIGN.md)
        entry: python3 scripts/check_architecture_projection.py
        language: system
        files: '(\.c4$|^\.ai-state/DESIGN\.md$|^claude/canonical-blocks/|^scripts/sync_canonical_blocks\.py$)'
        pass_filenames: false

      # Block E — rules-manifest drift. --check (no write); fires on staged
      # rules/ changes.
      - id: rules-manifest-drift
        name: Rules-manifest drift
        entry: python scripts/regenerate_rules_manifest.py --check
        # language: python (not system) -- this script imports PyYAML, and the
        # ambient python3 is not guaranteed to have the project's declared deps.
        language: python
        additional_dependencies: ['pyyaml']
        files: '^rules/(_manifest\.yaml|.*\.md)$'
        pass_filenames: false

      # Block F — HTML authorship boundary. --files receives the staged .html
      # paths; each must be allowlisted (EXEMPT_PATH_PREFIXES) or have a
      # same-basename .md sibling carrying share_out: true.
      - id: html-authorship-boundary
        name: HTML authorship boundary
        entry: python scripts/check_html_authorship.py --repo-root . --files
        # language: python (not system) -- imports PyYAML; see rules-manifest-drift.
        language: python
        additional_dependencies: ['pyyaml']
        files: '\.html$'
        pass_filenames: true

      # Block B4 — .ai-state/ ledger schema. Same defect class as Block B on a
      # third surface, and the one with no parser at all: `.ai-state/` is a data
      # format with a specification (the schema references) and no code that
      # reads it. Every writer is an agent following prose, so the only feedback
      # was whether a downstream reader happened to notice — which is how 49
      # rows drifted their `dedup_key`, seven wrote a slug into a hex column, a
      # `||` in a notes cell split a row into 16 fields, and a row landed past
      # the trailing prose section where every counting recipe is blind to it.
      #
      # Whole-repo `--check` rather than `--files`: the tech-debt pair shares one
      # `dedup_key` namespace ACROSS its two files, so a uniqueness violation is
      # only visible when both are read. A per-file invocation would be blind to
      # exactly the collision that erases a `td-NNN` at the next finalize run.
      #
      # `files:` MUST list every path in the script's LEDGERS registry — a test
      # asserts that, so registering a sixth ledger without widening this pattern
      # fails rather than silently shipping an ungated file. Working-tree read
      # (no `--staged`): unlike the ADR gate below, no tooling here stages a blob
      # that differs from the tree.
      # `PROGRESS.md` survives only as an orchestrator-owned hackathon journal.
      # The original sweep scanned `agents/` alone, so producer-side claims
      # survived in user docs and in a canonical block shipped to every managed
      # project -- two of them asserting the opposite of the matching command.
      # The wider scan is only a guard if something runs it.
      - id: progress-mandate-drift
        name: PROGRESS.md writer discipline
        entry: python3 scripts/strip_progress_mandate.py --check
        language: system
        files: '^(agents/.*\.md|commands/.*\.md|docs/.*\.md|claude/canonical-blocks/.*\.md|skills/.*\.md|hooks/send_event\.py|rules/writing/html-output-conventions\.md|scripts/strip_progress_mandate\.py)$'
        pass_filenames: false

      - id: state-ledger-schema
        name: .ai-state/ ledger schema
        entry: python3 scripts/check_state_ledgers.py --check --repo-root .
        language: system
        files: '^\.ai-state/(TECH_DEBT_(LEDGER|RESOLVED)|CONSULT_(LEDGER|COSTS|PRIORS)|calibration_log)\.md$'
        pass_filenames: false

      # Block B5 — artifact frontmatter must LOAD, not merely contain the right
      # words. The sentinel's C04/S01/S02 grep for field presence, and a grep
      # for `description:` succeeds on a file no YAML parser can read: two
      # commands shipped an unquoted `argument-hint: [<a>] [--b <c>]` (two flow
      # sequences on one line), their whole frontmatter block unloadable, every
      # presence-grep green throughout. A command whose frontmatter does not
      # load cannot register its `description` — the sole model-invocation
      # mechanism. This is the parser those greps stand in for.
      #
      # Whole-repo `--repo-root .` rather than `--files`: the scan is ~150 small
      # files, and a per-file invocation would go blind the moment an artifact
      # is repaired in one commit and regressed in another.
      #
      # `language: python` + additional_dependencies (not `system`) — the gate
      # needs a REAL parser, and the ambient python3 on a developer machine is
      # not guaranteed to hold PyYAML (gate-liveness GL05: a gate that dies on
      # import is indistinguishable from no gate). Same disposition as
      # rules-manifest-drift and html-authorship-boundary above. The script
      # additionally guards the import and raises naming `sys.executable`, so a
      # bare `python3` run fails loudly instead of reporting clean.
      #
      # `files:` MUST cover every surface the script scans — a test asserts the
      # pattern matches every scanned path, so widening SCAN_GLOBS without
      # widening this pattern fails rather than silently shipping a blind gate.
      - id: artifact-frontmatter-parse
        name: Artifact frontmatter parses
        entry: python scripts/check_frontmatter_parses.py --repo-root .
        language: python
        additional_dependencies: ['pyyaml']
        files: '^(commands/[^/]+\.md|agents/[^/]+\.md|skills/[^/]+/SKILL\.md|rules/.*\.md)$'
        pass_filenames: false

      # Block B6 — replicated agent prose blocks. Same defect class as Block B
      # on a fourth surface, and the one where the usual remedy is unavailable:
      # the task-slug scoping paragraph is inlined into FIFTEEN agent
      # definitions and cannot be extracted (agents inherit neither rules nor
      # CLAUDE.md, and agent-crafting forbids runtime reference files for
      # plugin-distributed agents — the Read resolves against the consumer's
      # cwd, not the plugin cache, and fails silently). It had already forked
      # into four textually distinct tails, each arrived at by a separate edit
      # to a separate file, none visible from any other. Nothing was looking.
      #
      # The source of truth is the constant inside the checker; the fifteen
      # sites are compared to it byte-for-byte. Deliberately NOT a
      # claude/canonical-block: those are `## Heading` sections shipped into
      # managed projects' CLAUDE.md behind `canonical-source` fences and
      # governed by the BLOCKS registry, which nothing keys off a directory
      # listing — an unregistered file there is invisible to every mechanism
      # that owns the directory.
      #
      # Whole-repo `--repo-root .` rather than `--files`: agreement is a
      # property of the SET, so a per-file invocation is blind to exactly the
      # case that matters (one site edited, fourteen left behind).
      #
      # `language: system` — stdlib-only by design. The gate is named in prose
      # and runs under the ambient interpreter, so a third-party import here
      # would make it the first finding of `check_gate_liveness.py --check
      # ambient-import`.
      #
      # `files:` MUST cover the scanned glob AND the checker itself: the
      # canonical text lives inside the script, so editing the source of truth
      # has to re-run the comparison against all fifteen sites. A test asserts
      # both halves, so widening SCAN_GLOB without widening this pattern fails
      # rather than silently shipping a blind gate.
      - id: agent-shared-blocks
        name: Agent shared-block agreement
        entry: python3 scripts/check_agent_shared_blocks.py --repo-root .
        language: system
        files: '^(agents/[^/]+\.md|scripts/check_agent_shared_blocks\.py)$'
        pass_filenames: false

      # Block G — ADR frontmatter promotion (td-103). Self-scans the staged
      # git index under .ai-state/decisions/ via --staged, so it catches a
      # finalize_adrs.py staging defect at the commit that would ship it,
      # even when the working tree already looks correct.
      - id: adr-frontmatter-promotion
        name: ADR frontmatter promotion
        entry: python3 scripts/check_adr_frontmatter_promotion.py --repo-root . --staged
        language: system
        files: '^\.ai-state/decisions/.*\.md$'
        pass_filenames: false

      # Block H — ADR back-link reciprocity (DL06). A one-directional
      # supersedes/superseded_by (or re_affirms/re_affirmed_by, or
      # supersedes_in_part/superseded_in_part_by) pair is invisible from any
      # single file's diff -- the missing half lives in the OTHER file -- so
      # this is a whole-corpus scan, per the agent-shared-blocks model above,
      # not a --staged single-file check. `--check` opts the advisory-by-
      # default script into a blocking gate; measured clean (0 findings) on
      # the live corpus before wiring.
      - id: adr-reciprocity
        name: ADR back-link reciprocity
        entry: python3 scripts/check_adr_reciprocity.py --repo-root . --check
        language: system
        files: '^(\.ai-state/decisions/.*\.md|scripts/check_adr_reciprocity\.py)$'
        pass_filenames: false

      # Block H2 — ADR index freshness (DL03). Advisory (no --check): invoked
      # with --json alone, which always exits 0 regardless of staleness (see
      # regenerate_adr_index.py's exit-code contract) -- the index self-heals
      # at the next finalize, so a blocking wiring here would redden every
      # feature-branch commit touching decisions/ before merge.
      - id: adr-index-freshness
        name: ADR index freshness (advisory)
        entry: python3 scripts/regenerate_adr_index.py --repo-root . --json
        language: system
        files: '^(\.ai-state/decisions/.*\.md|scripts/regenerate_adr_index\.py)$'
        pass_filenames: false

      # Block I — agent prompt size (T03). Advisory only, deliberately no
      # --check: the live agents/sentinel.md already sits in derived WARN
      # today (S=352 -> warn 652, 680-line file), so a blocking wiring here
      # would redden every commit by every contributor touching any file, not
      # just the one over its ceiling. The safety is the script's own default
      # exit-0 behavior, not special pre-commit syntax -- no `|| true` or
      # similar softening exists anywhere else in this file and none is added
      # here either.
      - id: agent-prompt-size
        name: Agent prompt size (advisory)
        entry: python3 scripts/check_agent_prompt_size.py --repo-root .
        language: system
        files: '^(agents/.*\.md|scripts/check_agent_prompt_size\.py)$'
        pass_filenames: false

      # Block J — doc manifest freshness (F11). WARN-only by construction
      # (never wired --check): staleness lags the dashboard's navigation, it
      # does not corrupt anything, and every commit touching docs/ or
      # .ai-state/ would otherwise redden on the routine case the check's own
      # two exclusions exist to filter out (its own regen commit; a body-only
      # edit to an already-indexed file). Scoped to the manifest, docs/,
      # .ai-state/, and the script itself -- the same substrate the script's
      # own git-log scan reads.
      - id: doc-manifest-freshness
        name: Doc manifest freshness (advisory)
        entry: python3 scripts/check_doc_manifest_freshness.py --repo-root .
        language: system
        files: '^(\.ai-state/doc_manifest\.yaml|docs/.*|\.ai-state/.*|scripts/check_doc_manifest_freshness\.py)$'
        pass_filenames: false

      # Block K — agent lifecycle pairing (P03). WARN-only by construction
      # (no --check): a WAL classification is advisory, matching the F11/T03
      # precedent -- a blocking gate on a rotating append-only log would
      # redden commits on backlog noise the check's own pre_baseline/
      # no_tool_use/incident classes exist to separate from a live defect.
      - id: agent-lifecycle-pairing
        name: Agent lifecycle pairing (advisory)
        entry: python3 scripts/check_agent_lifecycle_pairing.py --repo-root .
        language: system
        files: '^(\.ai-state/observations\.jsonl|scripts/check_agent_lifecycle_pairing\.py)$'
        pass_filenames: false

      # Block L — no AI-authorship trailer (td-196). Blocking, on the commit-msg
      # stage: the message file is the single positional argument pre-commit
      # passes for that stage. The rule lives in rules/swe/vcs/git-conventions.md
      # and was prose-only; subagents receive a session-level instruction that
      # presents the trailer as mandated and prose loses that contest, so two of
      # 21 pipeline commits shipped one. Stdlib-only script: liveness under any
      # interpreter pre-commit resolves.
      - id: no-ai-authorship-trailer
        name: Commit message carries no AI-authorship trailer
        entry: python3 scripts/check_commit_msg_authorship.py
        language: system
        stages: [commit-msg]

      # Block M — staleness markers (F07/F08/F09). Advisory (no --check): a
      # marker older than its skill's threshold is sentinel-visible drift, not a
      # defect in the commit that happens to touch the skill; the live corpus
      # carries 42 such warnings today, so a blocking entry would redden every
      # skill edit on backlog. Matches the F11/T03/P03 precedent.
      - id: staleness-markers
        name: Skill staleness markers (advisory)
        entry: python3 scripts/check_staleness_markers.py --repo-root .
        language: system
        files: '^(skills/.*/(SKILL\.md|references/.*\.md|contexts/.*\.md)|scripts/check_staleness_markers\.py)$'
        pass_filenames: false

      # Block N — specialist dispositions (P07). Declared exception: the real
      # substrate is the gitignored .ai-work/ tree, which no commit can carry,
      # so this entry exists for LIVENESS (the script is invoked by something
      # and loads under the ambient interpreter — check_gate_liveness GL04/GL05),
      # not enforcement. The sentinel's Phase 3 is the enforcing caller.
      - id: specialist-dispositions
        name: Specialist-design dispositions (liveness only)
        entry: python3 scripts/check_specialist_dispositions.py --repo-root .
        language: system
        files: '^scripts/check_specialist_dispositions\.py$'
        pass_filenames: false

      # Block O — git hook installation (F10). Advisory (no --check): an installed
      # hook drifting from its source is an environment fact, not a property of the
      # commit; the sentinel's Phase 3 is the reporting caller. Files-scoped to the
      # hook sources so the entry fires exactly when a source changes.
      - id: hook-installation
        name: Git hook source/installed mirror (advisory)
        entry: python3 scripts/check_hook_installation.py --repo-root .
        language: system
        files: '^(scripts/git-.*-hook\.sh|scripts/check_hook_installation\.py)$'
        pass_filenames: false

      # Block P — state corpus (DL01 DL02 SH01 SH02 CA01). Advisory (no --check):
      # the live corpus carries 42 SH01 spec-path findings today, so a blocking
      # entry would redden every .ai-state edit on backlog; the F11/T03/P03
      # precedent. Scoped to the substrate the five checks read.
      - id: state-corpus
        name: .ai-state decision/spec/calibration corpus (advisory)
        entry: python3 scripts/check_state_corpus.py --repo-root .
        language: system
        files: '^(\.ai-state/(decisions/.*|specs/.*|calibration_log\.md)|scripts/check_state_corpus\.py)$'
        pass_filenames: false

      # Block Q — test-topology conformance (TT01 TT02 TT05 TT06). Advisory
      # (no --check): TT06 runs even when TEST_TOPOLOGY.md is absent, so a
      # blocking entry would fire on every commit in a topology-less project.
      # Scoped to the topology file, its trunk/leaf schema docs, and the script.
      - id: topology-conformance
        name: Test-topology conformance (advisory)
        entry: python3 scripts/check_topology_conformance.py --repo-root .
        language: system
        files: '^(\.ai-state/TEST_TOPOLOGY\.md|skills/testing-strategy/references/.*\.md|scripts/check_topology_conformance\.py)$'
        pass_filenames: false

      # Block R — hackathon graduation nudge (HK01). Declared exception: the
      # real gate is `PRAXION_HACKATHON_MODE=1` in a project's own
      # `.claude/settings.json`, which no commit in this repo carries, so this
      # entry exists for LIVENESS (the script is invoked by something and loads
      # under the ambient interpreter -- check_gate_liveness GL04/GL05), not
      # enforcement. There is no sensible `files:` substrate scope -- the check
      # is env-gated, not filesystem-substrate-gated -- so it is scoped to the
      # script itself, same declared-exception pattern as Block N (P07). The
      # sentinel's Phase 3 is the enforcing/reporting caller.
      - id: hackathon-graduation
        name: Hackathon mode graduation nudge (liveness only)
        entry: python3 scripts/check_hackathon_graduation.py --repo-root .
        language: system
        files: '^scripts/check_hackathon_graduation\.py$'
        pass_filenames: false

      # Block S — sentinel self-verification (V01 V02 V03 V04). Advisory (no
      # --check): the substrate is sentinel's own registration across four files
      # the sentinel maintainer edits together; scoped to those four plus the
      # script itself so any of the five touching a commit re-runs the check.
      - id: sentinel-self-audit
        name: Sentinel self-verification (advisory)
        entry: python3 scripts/check_sentinel_self_audit.py --repo-root .
        language: system
        files: '^(agents/sentinel\.md|\.claude-plugin/plugin\.json|agents/README\.md|skills/software-planning/references/coordination-details\.md|scripts/check_sentinel_self_audit\.py)$'
        pass_filenames: false

      # Block S — registry-projection family (X01 X02 X05 X06 EC01 EC02). Advisory
      # (no --check): the substrate is plugin.json plus the agent/skill/command
      # registries it and the two roster tables project against; scoped to those
      # surfaces plus the script itself so any of them touching a commit re-runs
      # the check.
      - id: registry-projection
        name: Registry projection (advisory)
        entry: python3 scripts/check_registry_projection.py --repo-root .
        language: system
        files: '^(\.claude-plugin/plugin\.json|agents/[^/]+\.md|skills/software-planning/references/coordination-details\.md|skills/[^/]+/SKILL\.md|commands/[^/]+\.md|scripts/check_registry_projection\.py)$'
        pass_filenames: false

      # Block T — path-resolution family (F01 F02 F05 X03 X09). Advisory
