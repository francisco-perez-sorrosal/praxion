        files: '^(skills/.*\.md|agents/.*\.md|commands/.*\.md|rules/.*\.md|\.ai-state/SYSTEM_DEPLOYMENT\.md|CLAUDE\.md|scripts/check_path_resolution\.py)$'
        pass_filenames: false

      # Block U — behavioral-contract family (BC01 BC03 BC04). Advisory
      # (no --check): the substrate is one always-loaded rule, the agent
