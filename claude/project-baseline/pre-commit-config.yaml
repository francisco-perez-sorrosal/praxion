# Canonical Praxion baseline .pre-commit-config.yaml — universal + stack-conditional.
#
# Single source of truth for the pre-commit baseline. /onboard-project Phase 8e
# (and /new-project) install this as `.pre-commit-config.yaml` at the repo root
# when none exists — never overwriting an existing one. Satisfies the
# agent-readiness style criterion: a pre-commit configuration is present.
#
# Wires the three things the rubric's remediation calls for: a linter, a
# formatter, and a secret scanner. The UNIVERSAL block (file hygiene + gitleaks)
# is always kept. Phase 8e KEEPS the PYTHON block only when Python is detected,
# the JS/TS block only when package.json is present, and the RUST block only
# when Cargo.toml is detected; it strips each non-applicable language block
# before writing. After install, the user runs `pre-commit install` once to
# activate the git hook. Bump `rev:` pins to the latest stable tags
# periodically — these are a safe modern floor.

repos:
  # --- UNIVERSAL (always kept) -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Generated project-intelligence artifacts under .ai-state/ are
        # intentionally large (metrics + readiness payloads, audit reports) and
        # committed by convention; the guard targets accidental source blobs.
        exclude: '^\.ai-state/(metrics_reports|sentinel_reports)/.*\.(json|md)$'
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks  # secret scanner — blocks committed credentials/tokens

  # --- PYTHON (keep iff Python detected) --------------------------------------
  # PIN COHERENCE — declare this SAME version as an exact dependency:
  #
  #     [dependency-groups]
  #     dev = ["ruff==0.15.22"]        # must equal the rev below
  #
  # and bump both together, always. Two independently-versioned ruffs
  # formatting the same files never converge: this hook reformats on commit,
  # your local ruff reformats back, `git add` never captures a stable state,
  # and the commit will not settle. The failure does not look like a version
  # problem — it looks like a formatter that cannot make up its mind, and
  # pre-commit's stash/restore around each failed attempt can silently revert
  # uncommitted work while you retry.
  #
  # A floating constraint (`ruff>=`, or no declared dependency at all) does not
  # protect you: it leaves the hook fighting a different version on every
  # machine. `/onboard-project` installs a commit gate that enforces the
  # equality; run `check_ruff_pin_drift.py` to verify it by hand.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff         # linter (reads [tool.ruff] from pyproject.toml)
        args: [--fix]
      - id: ruff-format  # formatter

  # --- JS/TS (keep iff package.json present) ----------------------------------
  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check  # lint + format in one tool (reads biome.json)
        additional_dependencies: ["@biomejs/biome@1.9.4"]

  # --- RUST (keep iff Cargo.toml detected) -------------------------------------
  # No external `rev:` pin here — same rationale as the PIN COHERENCE note on
  # the PYTHON block above: a pinned pre-commit repo drifts from whatever
  # `rustfmt`/`clippy` the local toolchain resolves, and two
  # independently-versioned formatters fighting over the same files never
  # converge. `repo: local` + `language: system` runs the toolchain's own
  # `cargo fmt` — always in lockstep with `rustup` (stable, or the project's
  # `rust-toolchain.toml` pin) — so there is no second version to fall out of
  # sync with.
  #
  # `cargo fmt` (unlike `ruff`) does not accept file arguments, so `--all` +
  # `pass_filenames: false` is the conventional shape and reformats the whole
  # package/workspace on every commit, not just the staged files — a repo that
  # objects to that scope can swap this hook for a staged-file `rustfmt
  # --edition <edition> --check`/`--emit files` invocation instead.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      # - id: cargo-clippy  # opt-in — slower; enable when the project wants a
      #   name: cargo clippy  # commit-time lint gate (Primer: clippy is a
      #   entry: cargo clippy --all-targets -- -D warnings  # merge-stage gate)
      #   language: system
      #   types: [rust]
      #   pass_filenames: false
