# pnpm settings for the standalone dashboard app (not a monorepo — no `packages:`).
# `allowBuilds` is the pnpm 11 schema for approving dependency build scripts (a
# per-package boolean map written by `pnpm approve-builds`); the pnpm 10
# `onlyBuiltDependencies` list form is silently ignored by v11, which is exactly
# how CI hit ERR_PNPM_IGNORED_BUILDS despite an allowlist being present.
# - sharp: transitive native dep of Next.js (image optimization). The dashboard
#   does not use next/image, but building it keeps a fresh `CI=true` install
#   green instead of erroring on an undispositioned script.
# - vue-demi: transitive of @scalar/api-reference-react; its postinstall is a
#   trivial vue2/vue3 API switch. Approved for the same reason.
# `scripts/praxion-dashboard install` additionally warn-and-continues past a
# non-zero pnpm exit, with the next-binary check as the real gate.
allowBuilds:
  sharp: true
  vue-demi: true
