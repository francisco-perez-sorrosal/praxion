[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxion-evals"
version = "0.52.1"
description = "Out-of-band quality measurement framework for Praxion agent pipelines — single entrypoint /eval-praxion with mechanical + LLM-judged check families over completed and in-flight artifacts."
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "claude-agent-sdk>=0.2.87",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
praxion-evals = "praxion_evals.harness.cli:main"
praxion-evals-live = "praxion_evals.live.cli:main"
praxion-evals-adherence = "praxion_evals.adherence.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright>=1.1.390",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praxion_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["integration: builds a real repo copy on disk, no network"]

# The step-loop gate runs this pocket's whole suite when a runner config changes: 822 s
# measured, so 1200 s leaves 46 percent headroom (the driver default is 540 s).
[tool.praxion.step-loop]
gate-timeout-seconds = 1200

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["trajectory_eval.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
# fixture_repos/ is disposable payload copied into live-session sandboxes at
# runtime, with its own self-contained relative imports — not part of the
# package's own importable surface.
exclude = ["tests", "build", "**/__pycache__", "src/praxion_evals/live/fixture_repos"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
