scenario_id: ui-step-conformance
description: >
  A seeded implementer step that touches a web UI surface. A conformant
  implementer step report cites the interface-layer skill's conventions by
  name rather than inventing ad-hoc UI judgment calls.
seeded_step: >
  Add a loading state to the ADR list view in dashboard_app/ so users see
  something within 100ms while decisions load from .ai-state/decisions/.
recorded_output: >
  Per the web-ui-design skill's five UI states, added a skeleton screen
  (load time >1s expected, layout known in advance) that approximates the
  final ADR-card grid, wrapped so it swaps to the default/empty/error state
  once the fetch resolves. Contrast and spacing follow the existing
  tokens.css scale — no ad-hoc values introduced.
required_citations:
  - "web-ui-design"
  - "skeleton"
  - "five UI states"
llm_rubric: >
  Judge whether the recorded implementer output (its report and, when present,
  the UI files it changed) genuinely applies the web-ui-design skill, not just
  names it. The skill requires every data surface to design all five UI
  states: Default (data loaded), Loading (data in flight; never blank),
  Empty (no data, not an error: explain why and offer an action), Error
  (what went wrong and how to recover; never a stack trace), and Partial
  result (some data loaded, some failed: show what succeeded, allow retry).
  For Loading it prescribes a skeleton when load time is expected above 1s
  and the layout is known, a spinner when duration is unknown, and no
  indicator under 100ms; a skeleton must approximate the final layout. The
  step does not state a load time, so a skeleton or a spinner is acceptable
  if the choice is consistent with that rule. FAIL when the Empty or Error
  state is missing, or when the loading indicator contradicts the rule;
  list which of the five states are present. Do not count accessibility
  attributes or visual variants as states.
