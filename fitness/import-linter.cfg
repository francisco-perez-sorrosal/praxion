# PYTHONPATH=eval/src is REQUIRED for every invocation, because praxion_evals
# lives in a sibling project that the root environment does not install. The
# graph builder parses rather than executes, so the package's own dependencies
# need not be present -- only the source tree must be findable. A missing path
# fails loudly ("Could not find package 'praxion_evals'", exit 1) rather than
# silently dropping the contract, so an invocation site that forgets it is
# caught on its first run instead of reporting a false all-clear.
#
# Invocation sites, all of which set it: fitness/tests/test_starter_rule.py,
# .github/workflows/architecture.yml, and the architect-validator's Phase 2.
[importlinter]
include_external_packages = True
root_packages =
    scripts
    praxion_evals

[importlinter:contract:check-scripts-precondition-boundary]
name = check_* (pre-commit) scripts must not import finalize_* (post-merge) scripts
type = forbidden
description = Pre-commit-time and post-merge-time scripts run in disjoint execution phases; one importing from the other would couple gates. CLAUDE.md§Structural Beauty: clean boundaries, cohesive modules.
source_modules =
    scripts.check_id_citation_discipline
    scripts.check_shipped_artifact_isolation
    scripts.check_squash_safety
forbidden_modules =
    scripts.finalize_adrs
    scripts.finalize_tech_debt_ledger

[importlinter:contract:eval-families-never-touch-an-sdk]
name = eval family code must reach LLMs only through the JudgeClient adapter
type = forbidden
# Direct imports only. Reaching an SDK *through* the adapter is the design, so a
# transitive ban would flag the one route that is correct. The invariant the
# code states three times in prose is about the direct import, and this encodes
# exactly that -- no more. The stronger property (the adapter is the *sole* SDK
# importer in the package) is not stated anywhere and is left unenforced rather
# than invented here.
allow_indirect_imports = True
description = dec-204 routes every judge call through a single adapter that owns the auth seam, refuses nested invocation, and enforces a wall-clock ceiling; a family importing an SDK directly bypasses all three.
source_modules =
    praxion_evals.harness.families
forbidden_modules =
    claude_agent_sdk
    anthropic
