# Minimal project metadata — Praxion's root is a coordination surface, not a
# distributed package. The [project] table exists only so that `uv sync --group
# dev` can install the dev dependency group into .venv/ at this repo root.
# Keep [project].version in sync with [tool.commitizen].version below; the
# commitizen bump will not auto-update this field unless added to
# [tool.commitizen].version_files with a disambiguating regex.
[project]
name = "praxion"
version = "0.17.0"
description = "Operational infrastructure for spec-driven development and context engineering"
requires-python = ">=3.11"
# Runtime dependency for the repo-root Python surface (scripts/). structlog is the
# canonical structured-logging library — see scripts/praxion_logging.py and the
# observability skill's Service Observability Baseline.
dependencies = [
    "structlog>=26.1.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.17.0"
version_files = [
    ".claude-plugin/plugin.json:version",
    "task-chronograph-mcp/pyproject.toml:version",
    "eval/pyproject.toml:version",
    # Root [project].version mirrors [tool.commitizen].version. The
    # ^version =  anchor disambiguates from "version_files = [..." on the
    # same file, while matching both [project].version and
    # [tool.commitizen].version lines (both get rewritten to the new value
    # on bump, which is the intended in-sync behavior).
    "pyproject.toml:^version = ",
]
tag_format = "v$version"
changelog_start_rev = "v0.0.0"
annotated_tag = true
# true so `cz bump` regenerates CHANGELOG.md and folds it INTO the bump commit,
# so the release tag points at a tree that already documents its own version
# (avoids the tag-precedes-changelog split). The release workflow relies on this.
update_changelog_on_bump = true
major_version_zero = true

# PEP 735 dependency groups — dev tooling for the repo root (scripts/
# and cross-cutting quality tools). Subpackages manage their own project
# dependencies in their respective pyproject.toml files.
#
# The coverage-tool configuration (pyproject.toml [tool.coverage.*],
# [tool.pytest.ini_options] coverage flags, etc.) is defined by the
# test-coverage skill's Python reference as a reusable default that
# Praxion adopts. Projects using pytest-cov elsewhere may reuse that
# reference or override it per their own needs.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "import-linter",
    "pyyaml",
    "pre-commit",
]

# --- test-coverage skill: default Python coverage config -------------------
# Produces `coverage.xml` (Cobertura format) at the project root, consumed by
# scripts/project_metrics/collectors/coverage_collector.py and any caller that
# loads the `test-coverage` skill. Override `omit`, `exclude_lines`, and the
# fail-under floor per project needs; leave the output path at `coverage.xml`
# so downstream tooling finds it at the first-candidate path.

[tool.pytest.ini_options]
# --cov-config is pinned explicitly (rather than left to pytest-cov's
# ".coveragerc" default) so that subprocess coverage embedding -- triggered
# automatically via pytest-cov's globally-installed .pth site hook whenever
# a spawned child inherits the COV_CORE_* env vars -- resolves to this exact
# file's [tool.coverage.run] branch=true, regardless of the child's own cwd.
# Tests that spawn `sys.executable` subprocesses with cwd set to a tmp_path
# fixture (not the repo root) cannot auto-discover pyproject.toml by relative
# search; without this pin they silently fall back to statement-only
# coverage, which the session-level combine step cannot merge with the
# parent's branch-mode data (INTERNALERROR coverage.exceptions.DataError).
addopts = "--cov --cov-config=pyproject.toml --cov-report=xml --cov-report=term-missing"
testpaths = ["tests", "scripts"]
markers = [
    "slow: marks tests that invoke real pip/venv operations (deselect with -m 'not slow')",
]
# Repo root on sys.path so tests can import `scripts.project_metrics.*`
# without requiring PYTHONPATH to be set by the invoker. scripts/ is not
# an installable package; this is the standard pytest pattern for flat
# layouts that ship helper tests alongside source.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "**/tests/*",
    "**/test_*.py",
    "**/conftest.py",
    ".venv/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
# Show missing line numbers in the terminal summary; do not fail the run on
# coverage alone (projects that want a hard floor set `fail_under` explicitly).
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
# Canonical artifact path. Changing this breaks downstream discovery.
output = "coverage.xml"
# --- end test-coverage skill defaults ---------------------------------------

# --- code-quality baseline (Praxion dogfoods its own onboarding Phase 8e) ----
# Single source of truth: skills/python-development/assets/ruff-baseline.toml.
# Installed here by the same mechanism /onboard-project applies to managed
# projects. Edit the asset, not this copy, to evolve the baseline. Satisfies the
# agent-readiness Style criteria (linter = [tool.ruff], formatter =
# [tool.ruff.format]).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]  # line length is owned by the formatter

[tool.ruff.lint.per-file-ignores]
# hooks/ and scripts/ must run on Python 3.9+ (shipped into user envs); UP017
# ("Use datetime.UTC alias") requires 3.11 — suppress so timezone.utc is kept.
"hooks/*.py" = ["UP017"]
"scripts/**/*.py" = ["UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# --- end code-quality baseline ----------------------------------------------

# --- static type-check baseline (Praxion dogfoods its own onboarding Phase 8e) ---
# Satisfies the agent-readiness Code Quality criterion (a static type-checker
# config is present). Scoped to scripts/ — the real root-level Python surface
# (the root has no src/). Subpackages (task-chronograph-mcp/, eval/) carry their
# own pyright config and CI step; this block is the root-surface baseline.
[tool.pyright]
include = ["scripts"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# --- end static type-check baseline -----------------------------------------
