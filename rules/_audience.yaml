# Who each always-loaded section serves.
#
# Every section (heading level two to four) of every always-loaded source, and every
# part of a mixed-audience section, has exactly one entry here. The sources are found
# from the repository (rules without a path scope, the user template, the project file),
# never listed. A part starts at the one line that begins with its `part` prefix and
# runs to the next part or the section's end; the first part starts at the section's
# first text line, so nothing is left unclassified.
#
# scope: core (every agent), role (the named agents or groups), orchestrator-only and
# no-actor (kept resident for the main session, never in a kernel; each gives a reason).
# form: verbatim (the source bytes) or condensed (an authored text under
# claude/kernels/src/, pinned to the source it stands for, so a changed source forces
# a review of the text). No section is removed from its source by being classified.
#
# The wire shape is read in one place, scripts/kernel_model.py; scripts/check_kernel_manifest.py
# holds the manifest to the sources. Regenerate the kernels with scripts/generate_kernels.py.
version: 1

# Declared groups: adr-author must equal the agents whose definitions create ADR
# draft fragments, ledger-writer the agents whose definitions append tech-debt rows.
groups:
  adr-author: [systems-architect, implementation-planner, interface-designer, agentic-transactions-architect]
  ledger-writer: [verifier, sentinel, architect-validator]

# Declared modules: the audience of each. A role entry joins the module whose audience
# equals its own; principles-anchor is declared before local-verifier because both
# serve the verifier alone and the first declared wins for an entry naming only it.
modules:
  adr-author: {audience: [adr-author]}
  adr-reader: {audience: [researcher, verifier]}
  ledger-writer: {audience: [ledger-writer]}
  principles-digest: {audience: [promethean, systems-architect]}
  principles-anchor: {audience: [verifier]}
  delegator: {audience: [roadmap-cartographer]}
  local-context-engineer: {audience: [context-engineer]}
  local-verifier: {audience: [verifier]}

# Authored texts kept under claude/kernels/src/: every kernel line that no rule section
# supplies verbatim is one of these. `condenses: null` marks kernel-only text.
