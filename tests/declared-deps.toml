# Non-code test dependencies the test selector cannot derive from layout,
# imports or path literals -- seeded (2026-09-28) from `.ai-state/TEST_TOPOLOGY.md`'s
# non-`.py` `file_dependencies`, mapped to each contributing group's
# `pytest-globs` selectors, then pruned empirically: for each seeded entry,
# `python3 scripts/resolve_test_scope.py --changed <sample-path> --json` was
# run with no declared-deps file present (the "remove it" baseline) against a
# representative tracked file per `paths` glob; every group's test list had
# at least one test unreachable via layout/import/path-literal alone, so
# every entry below survived the prune (none of TEST_TOPOLOGY.md's non-code
# file_dependencies were fully redundant with the other three sources --
# expected, since a markdown/config/shell file has no Python module identity
# for layout or import to see, and only some are literally quoted in test
# source). Entries sharing an identical owning-group set were merged into one
# `[[dep]]` (same `tests` union, combined `paths`) to avoid restating the same
# test list once per file.
# Contract: Praxion's testing-strategy skill, test-selection reference.
#
# Two entry kinds. Add one only when the selection audit reports a miss, or when
# a new test reads a file no code path names:
#
#   [[dep]]
#   paths = ["data/schemas/*.json"]    # repo-relative globs (** crosses dirs)
#   tests = ["tests/test_schemas.py"]  # repo-relative test files or globs
#   why   = "loads every schema by directory scan"
#
#   [[inert]]
#   paths = ["docs/archive/**"]
#   why   = "frozen material; no test reads it"
